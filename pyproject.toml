[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-dev-test-task"
version = "0.1.0"
description = "AI coding interview exercise for a review moderation service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiohttp>=3.9,<4.0",
  "joblib>=1.4,<2.0",
  "numpy>=1.24",
  "pandas>=2.2",
  "pyarrow>=16",
  "scikit-learn>=1.5,<2.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.8",
  "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
